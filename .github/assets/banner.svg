<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <radialGradient id="glowGreen" cx="27%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowSlate" cx="80%" cy="78%" r="60%">
      <stop offset="0%" stop-color="#8fa3b0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8fa3b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c9f2d0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="#0d1117"/>
  <rect width="1200" height="320" fill="url(#glowGreen)"/>
  <rect width="1200" height="320" fill="url(#glowSlate)"/>

  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="107" x2="1200" y2="107"/>
    <line x1="0" y1="214" x2="1200" y2="214"/>
  </g>

  <!-- un documento Markdown en miniatura a cada lado: título, regla y párrafo -->
  <g opacity="0.5">
    <rect x="112" y="222" width="34" height="8" rx="2" fill="#3fb950"/>
    <rect x="112" y="236" width="72" height="1.5" fill="#ffffff" opacity="0.5"/>
    <rect x="112" y="246" width="72" height="4" rx="2" fill="#8b949e"/>
    <rect x="112" y="256" width="58" height="4" rx="2" fill="#8b949e"/>
    <rect x="1016" y="222" width="34" height="8" rx="2" fill="#3fb950"/>
    <rect x="1016" y="236" width="72" height="1.5" fill="#ffffff" opacity="0.5"/>
    <rect x="1016" y="246" width="72" height="4" rx="2" fill="#8b949e"/>
    <rect x="1016" y="256" width="58" height="4" rx="2" fill="#8b949e"/>
  </g>

  <text x="600" y="172" text-anchor="middle"
        font-family="ui-rounded,'SF Pro Rounded',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif"
        font-size="124" font-weight="700" letter-spacing="-1.5"
        fill="url(#textFade)"><tspan fill="#3fb950">#</tspan> MTV</text>

  <text x="600" y="224" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',system-ui,sans-serif"
        font-size="25" font-weight="500" letter-spacing="0.5"
        fill="rgba(228,240,232,0.55)">markdown terminal viewer</text>
</svg>
